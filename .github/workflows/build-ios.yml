name: Build iOS IPA (Masrofi)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Masrofi iOS IPA
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: node scripts/build.js

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj

      - name: Build iOS Application (.app)
        run: |
          mkdir -p build
          if ! xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""; then
              echo "xcodebuild archive returned non-zero, falling back to xcodebuild build with derivedDataPath..."
              xcodebuild build \
                -project ios/App/App.xcodeproj \
                -scheme App \
                -configuration Release \
                -destination 'generic/platform=iOS' \
                -derivedDataPath "$PWD/build/DerivedData" \
                CODE_SIGNING_ALLOWED=NO \
                CODE_SIGNING_REQUIRED=NO \
                CODE_SIGN_IDENTITY=""
          fi

      - name: Package Masrofi.ipa
        run: |
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found in build folder!"
            find build -maxdepth 4
            exit 1
          fi
          echo "Found compiled iOS app bundle at: $APP_PATH"
          if [ ! -f "$APP_PATH/App" ]; then
            echo "Error: Native executable $APP_PATH/App is missing!"
            ls -la "$APP_PATH"
            exit 1
          fi
          file "$APP_PATH/App"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qr Masrofi.ipa Payload
          echo "=== Verifying Payload/App.app contents ==="
          ls -la Payload/App.app
          echo "=== Masrofi.ipa created successfully ==="
          ls -lh Masrofi.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Masrofi-iOS-IPA
          path: Masrofi.ipa
          retention-days: 14

      - name: Create GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0-ios
          name: Masrofi iOS App v1.0.0 (IPA)
          body: |
            ## Masrofi · مصروفي - تطبيق iOS الأصلي (ملف IPA)
            
            يمكنك تحميل ملف `Masrofi.ipa` وتثبيته مباشرة على جهاز الآيفون الخاص بك باستخدام:
            - **Sideloadly** (على Windows أو Mac)
            - **AltStore**
            - **TrollStore**
            - أو أي أداة تثبيت تطبيقات iOS.
          files: Masrofi.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
