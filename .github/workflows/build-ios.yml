name: Build iOS IPA (Masrofi)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Masrofi iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: node scripts/build.js

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Application (.app)
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR=build

      - name: Package Masrofi.ipa
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/App.app Payload/
          zip -qr Masrofi.ipa Payload
          echo "Masrofi.ipa created successfully!"
          ls -lh Masrofi.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Masrofi-iOS-IPA
          path: Masrofi.ipa
          retention-days: 14

      - name: Create GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0-ios
          name: Masrofi iOS App v1.0.0 (IPA)
          body: |
            ## Masrofi · مصروفي - تطبيق iOS الأصلي (ملف IPA)
            
            يمكنك تحميل ملف `Masrofi.ipa` وتثبيته مباشرة على جهاز الآيفون الخاص بك باستخدام:
            - **Sideloadly** (على Windows أو Mac)
            - **AltStore**
            - **TrollStore**
            - أو أي أداة تثبيت تطبيقات iOS.
          files: Masrofi.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
